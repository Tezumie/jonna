[package]
name = "remote-server"
version = "0.1.0"
edition = "2021"
publish = false
license = "UNLICENSED"
description = "The IDE's server for folders on another machine (docs/remote.md)."

# Its own workspace: built on its own (scripts/build-server.mjs), for Linux targets, and never
# part of the app's build.
[workspace]

[[bin]]
name = "ide-server"
path = "src/main.rs"

[dependencies]
# Only crates the app itself depends on, all permissive: base64, regex, serde, serde_json,
# thiserror, libc, notify-debouncer-full (MIT/Apache-2.0); grep-* and ignore (MIT/Unlicense);
# notify (CC0-1.0, with inotify: ISC; mio: MIT). Terminals use libc's openpty, not a crate.
base64 = "0.22.1"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4.33"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
regex = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[target."cfg(unix)".dependencies]
libc = "0.2"

# A small static binary to upload over SSH. Panics unwind (not abort): a bug in one request ends
# that request with an error instead of the whole server, which would leave its children behind.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
