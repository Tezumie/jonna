# CI (PLAN §14): checks, unit tests and Rust tests on each push. The command-script UI tests
# (tests/scripts, a debug build with dev commands; Linux under Xvfb) take long, so they run only
# when started (`gh workflow run ci`, or Actions -> ci -> Run workflow): an agent asks the owner
# first, after a batch of changes or before a release (AGENTS.md, Upkeep).
# macOS is left out until the macOS pass (docs/feature-gaps.md): GitHub refused its runner for
# this repository ("configuration not supported"), so every run was red for that alone.
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      # The repository's text is LF; Windows' default autocrlf checked it out as CRLF and the
      # formatter check failed on every file.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run licenses
      - name: Rust
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - run: npm run build:web && npm run size
      - name: Build the app (debug, with dev commands)
        if: github.event_name == 'workflow_dispatch'
        run: npx tauri build --debug --no-bundle -c src-tauri/tauri.test.conf.json
      - name: Command-script tests
        if: github.event_name == 'workflow_dispatch'
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: npm run test:ui
